<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nextepisode</title>
  <meta name="description" content="nextepisode — this is where Adrian is trying things." />
  <!-- Personal holding page: keep it out of search indexes. -->
  <meta name="robots" content="noindex" />

  <!-- Favicon (also used, untouched, as the on-page logo). -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />

  <!-- Self-hosted fonts: Roboto (everything) + Bitter (the wordmark only). -->
  <link rel="preload" href="/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/bitter-latin.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    @font-face {
      font-family: 'Roboto';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('/fonts/roboto-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215;
    }
    @font-face {
      font-family: 'Roboto';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('/fonts/roboto-latinext.woff2') format('woff2');
      unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB,
        U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Bitter';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('/fonts/bitter-latin.woff2') format('woff2');
    }

    :root {
      --bg: #000000;
      --fg: #f2f3f5;
      --muted: #8b939d;
      --link: #74d3da;          /* light teal from the projects' palette — high contrast on black */
      --link-hover: #a7e7ec;
      --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wrap { width: 100%; max-width: 560px; }

    /* On-page logo: the favicon's network mark, inlined so its nodes can be
       animated independently. The favicon.svg file itself is untouched (still
       the browser-tab icon); here it's drawn white via currentColor. */
    .logo {
      display: block;
      width: 64px;
      height: 64px;
      margin: 0 auto 30px;
      color: var(--fg);
      overflow: visible;
      animation: tint 0.444s step-end infinite;   /* state colour (snaps with the rotation) */
    }
    .logo .link { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .logo .node,
    .logo .hub  { fill: currentColor; }

    /* Spokes rotate AND scale about the SVG centre (16,16). Scaling a spoke
       extends/retracts its node radially while the link stays pinned to the
       hub (the centre is the fixed point of both transforms). */
    .rotor,
    .spoke { transform-box: view-box; transform-origin: 16px 16px; }
    .hub   { transform-box: fill-box; transform-origin: center; }

    /* Stepped, not smooth: every ~0.15s the whole mark SNAPS to the next of 3
       states — rotating 120° and switching to that state's node-shape and
       colour. One shared 0.444s clock + step-end timing, so all four snap together. */
    .rotor      { animation: rotor-step 0.444s step-end infinite; }
    .spoke.s1,
    .spoke.s3   { animation: reach-a 0.444s step-end infinite; }   /* left nodes  */
    .spoke.s2,
    .spoke.s4   { animation: reach-b 0.444s step-end infinite; }   /* right nodes */
    .hub        { animation: hub-breathe 0.444s step-end infinite; }

    /* Three states, ~6.75 snaps per second — 120° per move (a full turn over 0.444s). */
    @keyframes rotor-step {
      0%      { transform: rotate(0deg); }
      33.333% { transform: rotate(120deg); }
      66.666% { transform: rotate(240deg); }
      100%    { transform: rotate(360deg); }
    }
    /* Colour per state: white · teal · orange (warm complement to the teal). */
    @keyframes tint {
      0%      { color: #f2f3f5; }
      33.333% { color: #74d3da; }
      66.666% { color: #fb923c; }
      100%    { color: #f2f3f5; }
    }
    /* Node reach per state — three distinct shapes:
       state 1 all retracted · state 2 all extended · state 3 left out / right in. */
    @keyframes reach-a {
      0%      { transform: scale(0.74); }
      33.333% { transform: scale(1.26); }
      66.666% { transform: scale(1.26); }
      100%    { transform: scale(0.74); }
    }
    @keyframes reach-b {
      0%      { transform: scale(0.74); }
      33.333% { transform: scale(1.26); }
      66.666% { transform: scale(0.74); }
      100%    { transform: scale(0.74); }
    }
    /* Hub steps size in sync, subtly. */
    @keyframes hub-breathe {
      0%      { transform: scale(0.95); }
      33.333% { transform: scale(1.12); }
      66.666% { transform: scale(1.04); }
      100%    { transform: scale(0.95); }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .rotor, .spoke, .hub { animation: none; }
    }

    h1 {
      margin: 0;
      font-family: 'Bitter', Georgia, 'Times New Roman', serif;   /* wordmark only */
      font-size: clamp(40px, 9vw, 68px);
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    .caret { color: var(--fg); }
    .tagline {
      margin: 16px 0 0;
      font-size: clamp(16px, 2.4vw, 19px);
      color: var(--muted);
    }
    .tagline a {
      color: var(--fg);
      text-decoration: underline;
      text-decoration-color: var(--muted);
      text-underline-offset: 2px;
      transition: color .15s ease, text-decoration-color .15s ease;
    }
    .tagline a:hover { color: var(--link); text-decoration-color: var(--link); }
    .tagline a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }

    .projects { margin-top: 60px; }
    .projects h2 {
      margin: 0 0 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .projects ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .projects a {
      color: var(--link);
      text-decoration: none;
      font-size: 18px;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: color .15s ease, border-color .15s ease;
    }
    .projects a:hover { color: var(--link-hover); border-bottom-color: currentColor; }
    .projects a:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 4px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <g class="rotor">
        <g class="spoke s1"><line class="link" x1="16" y1="16" x2="7.5"  y2="8" />    <circle class="node" cx="7.5"  cy="8"    r="3" /></g>
        <g class="spoke s2"><line class="link" x1="16" y1="16" x2="24.5" y2="9" />    <circle class="node" cx="24.5" cy="9"    r="2.2" /></g>
        <g class="spoke s3"><line class="link" x1="16" y1="16" x2="8.5"  y2="24.5" /> <circle class="node" cx="8.5"  cy="24.5" r="2.2" /></g>
        <g class="spoke s4"><line class="link" x1="16" y1="16" x2="24.5" y2="24" />   <circle class="node" cx="24.5" cy="24"   r="3.2" /></g>
        <circle class="hub" cx="16" cy="16" r="4" />
      </g>
    </svg>
    <h1>nextepisode<span class="caret">&gt;</span></h1>
    <p class="tagline">this is where <a href="https://www.linkedin.com/in/adriankingston/" target="_blank" rel="noopener noreferrer" title="Adrian Kingston on LinkedIn">Adrian</a> is trying things</p>

    <section class="projects">
      <h2>Projects</h2>
      <ul>
        <li><a href="https://browser.nextepisode.nz">Te Papa Collections Browser</a></li>
        <li><a href="https://museum.nextepisode.nz">Te Papa Digital Museum</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
